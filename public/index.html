<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>erosion</title>
<link rel="stylesheet" href="tokens.css">
<style>
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
main{max-width:56rem;margin:0 auto;padding:1.5rem}
form{display:flex;flex-wrap:wrap;gap:1rem;align-items:end;margin-bottom:1rem}
label{display:grid;gap:.25rem;color:var(--muted);font-size:.875rem}
input,select{font:inherit;padding:.4rem .6rem;color:var(--fg);background:transparent;border:1px solid var(--muted);border-radius:.25rem}
input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
canvas{display:block;width:100%;height:auto;aspect-ratio:1;background:var(--muted);image-rendering:pixelated}
#strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(10rem,1fr));gap:1rem;margin-top:1rem}
figure{margin:0}figcaption{color:var(--muted);font-size:.875rem}
#status{color:var(--muted)}
</style>
</head>
<body>
<main>
<h1>erosion</h1>
<form onsubmit="return false">
<label>Seed<input id="seed" type="text" inputmode="numeric" value="1"></label>
<label>Preset<select id="preset"></select></label>
<label><span><input id="contours" type="checkbox" checked> Contour lines</span></label>
</form>
<p id="status" role="status">Generating terrain...</p>
<canvas id="main" width="256" height="256" role="img" aria-label="Shaded relief map of the selected preset, coloured by height and slope"></canvas>
<div id="strip"></div>
</main>
<script type="module" src="main.js"></script>
</body>
</html>
